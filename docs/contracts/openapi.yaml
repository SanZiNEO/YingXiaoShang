openapi: 3.0.3
info:
  title: 营小商服务端
  version: 0.1.0
  description: 营小商学习助手服务端：30 个 RPC 业务方法、5 个专用通道与 4 个只读兼容方法。
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 存活与数据自检（无前缀，容器探活使用）
      security: []
      responses:
        "200":
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResult"
        "503":
          description: 数据库打不开或数据缺失
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /metrics:
    get:
      summary: Prometheus 指标文本
      security: []
      responses:
        "200":
          description: text/plain; version=0.0.4
          content:
            text/plain:
              schema:
                type: string
  /api/v1/health:
    get:
      summary: 存活与数据自检（带 API 前缀）
      security: []
      responses:
        "200":
          description: 健康检查结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResult"
        "503":
          description: 数据库打不开或数据缺失
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/auth/login:
    post:
      summary: 学号 + 口令登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - studentId
                - password
              properties:
                studentId:
                  type: string
                  example: "20230001"
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - result
                  - requestId
                  - elapsedMs
                properties:
                  ok:
                    type: boolean
                  result:
                    $ref: "#/components/schemas/LoginResult"
                  requestId:
                    type: string
                    example: req_9f2a1b3c4d5e
                  elapsedMs:
                    type: integer
        "400": &a1
          description: 参数校验失败（BAD_REQUEST）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401": &a2
          description: 未登录或登录已失效（AUTH_REQUIRED / AUTH_INVALID / AUTH_FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403": &a3
          description: 资源不属于当前学号（FORBIDDEN）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404": &a4
          description: 记录或方法不存在（NOT_FOUND / UNKNOWN_METHOD）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413": &a5
          description: 请求体超过 1 MiB（PAYLOAD_TOO_LARGE）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429": &a6
          description: 触发限流（RATE_LIMITED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500": &a7
          description: 服务端内部错误（INTERNAL）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "501": &a8
          description: 预留能力尚未实现（NOT_IMPLEMENTED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502": &a9
          description: 上游依赖失败（UPSTREAM_FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "504": &a10
          description: 上游超时（TIMEOUT）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /api/v1/auth/logout:
    post:
      summary: 注销当前 token
      responses:
        "200":
          description: 已注销
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "413": *a5
        "429": *a6
        "500": *a7
        "501": *a8
        "502": *a9
        "504": *a10
  /api/v1/auth/cas/callback:
    get:
      summary: CAS 统一身份认证回调（预留，本阶段 501）
      security: []
      responses:
        "501": *a8
    post:
      summary: CAS 统一身份认证回调（预留，本阶段 501）
      security: []
      responses:
        "501": *a8
  /api/v1/auth/oauth/callback:
    get:
      summary: OAuth2 回调（预留，本阶段 501）
      security: []
      responses:
        "501": *a8
    post:
      summary: OAuth2 回调（预留，本阶段 501）
      security: []
      responses:
        "501": *a8
  /api/v1/rpc:
    post:
      summary: RPC 单端点分发（30 个业务方法）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - method
              properties:
                method:
                  type: string
                  enum:
                    - student.current
                    - chapters.list
                    - kps.list
                    - news.list
                    - news.status
                    - news.refresh
                    - news.get
                    - news.match
                    - questions.attempts
                    - profile.get
                    - profile.growth
                    - profile.evidence
                    - profile.snapshot
                    - profile.review
                    - artifacts.list
                    - artifacts.get
                    - artifacts.export
                    - memory.facts
                    - memory.episodes
                    - memory.summary
                    - memory.upsert
                    - memory.delete
                    - chat.sessions
                    - chat.messages
                    - agent.snapshot
                    - agent.suggestions
                    - agent.turns
                    - agent.ledger
                    - agent.retry
                    - agent.sessions
                params:
                  type: object
                  additionalProperties: true
                requestId:
                  type: string
                  pattern: ^req_[a-z0-9]{1,24}$
      responses:
        "200":
          description: 调用成功（result 形状随 method 而定）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - result
                  - requestId
                  - elapsedMs
                properties:
                  ok:
                    type: boolean
                  result:
                    $ref: "#/components/schemas/StudentCurrentResult"
                  requestId:
                    type: string
                    example: req_9f2a1b3c4d5e
                  elapsedMs:
                    type: integer
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "413": *a5
        "429": *a6
        "500": *a7
        "501": *a8
        "502": *a9
        "504": *a10
  /api/v1/chat/stream:
    post:
      summary: 对话 SSE 流式通道
      description: 事件顺序：session → (round | text | tool | tool-end)* → done；异常只发 error 后关闭。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - message
              properties:
                sessionId:
                  type: string
                message:
                  type: string
                  maxLength: 8000
                chapterId:
                  type: string
                scopeOverride:
                  type: object
                  additionalProperties: true
                requestId:
                  type: string
                  pattern: ^req_[a-z0-9]{1,24}$
      responses:
        "200":
          description: text/event-stream 帧序列
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "413": *a5
        "429": *a6
        "500": *a7
        "501": *a8
        "502": *a9
        "504": *a10
  /api/v1/chat/cancel:
    post:
      summary: 取消在途轮次
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - requestId
              properties:
                requestId:
                  type: string
                  pattern: ^req_[a-z0-9]{1,24}$
      responses:
        "200":
          description: 取消指令已投递（cancelled=false 表示无在途轮次）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - cancelled
                properties:
                  cancelled:
                    type: boolean
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "413": *a5
        "429": *a6
        "500": *a7
        "501": *a8
        "502": *a9
        "504": *a10
  /api/v1/answer:
    post:
      summary: 单题作答
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - sessionId
                - questionId
                - answer
              properties:
                sessionId:
                  type: string
                questionId:
                  type: string
                answer:
                  type: string
                artifactId:
                  type: string
                chapterId:
                  type: string
      responses:
        "200":
          description: 作答结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - result
                  - requestId
                  - elapsedMs
                properties:
                  ok:
                    type: boolean
                  result:
                    $ref: "#/components/schemas/AnswerOutput"
                  requestId:
                    type: string
                    example: req_9f2a1b3c4d5e
                  elapsedMs:
                    type: integer
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "413": *a5
        "429": *a6
        "500": *a7
        "501": *a8
        "502": *a9
        "504": *a10
  /api/v1/answer-set:
    post:
      summary: 交卷（整份题目集）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
                - sessionId
                - artifactId
                - answers
              properties:
                sessionId:
                  type: string
                artifactId:
                  type: string
                chapterId:
                  type: string
                answers:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    required:
                      - questionId
                      - answer
                    properties:
                      questionId:
                        type: string
                      answer:
                        type: string
      responses:
        "200":
          description: 交卷结果
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                  - ok
                  - result
                  - requestId
                  - elapsedMs
                properties:
                  ok:
                    type: boolean
                  result:
                    $ref: "#/components/schemas/AnswerSetOutput"
                  requestId:
                    type: string
                    example: req_9f2a1b3c4d5e
                  elapsedMs:
                    type: integer
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "413": *a5
        "429": *a6
        "500": *a7
        "501": *a8
        "502": *a9
        "504": *a10
  /api/v1/openapi.yaml:
    get:
      summary: 返回本契约文件原文
      security: []
      responses:
        "200":
          description: OpenAPI YAML 文本
          content:
            application/yaml:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    Chapter:
      type: object
      additionalProperties: true
      required:
        - id
        - number
        - title
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
        title:
          type: string
        source_path:
          type: string
    KnowledgePoint:
      type: object
      additionalProperties: true
      required:
        - id
        - chapter_id
        - name
      properties:
        id:
          type: string
        chapter_id:
          type: string
        section_id:
          type: string
        name:
          type: string
        name_en:
          type: string
        definition:
          type: string
        keywords:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
        non_examples:
          type: array
          items:
            type: string
        aliases:
          type: array
          items:
            type: string
        difficulty:
          type: integer
          format: int64
        competencies:
          type: array
          items:
            type: string
        decisions:
          type: array
          items:
            type: string
        source:
          type: string
        status:
          type: string
        parent_id:
          type: string
          nullable: true
    NewsArticle:
      type: object
      additionalProperties: true
      required:
        - id
        - source
        - title
        - url
        - published_at
        - content
        - content_status
      properties:
        id:
          type: string
        source:
          type: string
        source_id:
          type: string
        title:
          type: string
        url:
          type: string
        author:
          type: string
        published_at:
          type: string
        summary:
          type: string
        content:
          type: string
        content_status:
          type: string
        rights:
          type: string
        fetched_at:
          type: string
    CaseMatch:
      type: object
      additionalProperties: true
      required:
        - article_id
        - kp_id
        - score
        - evidence_span
        - review_status
      properties:
        article_id:
          type: string
        kp_id:
          type: string
        score:
          type: number
        confidence:
          type: number
        tag_role:
          type: string
        evidence_span:
          type: string
        evidence_start:
          type: integer
          format: int64
        evidence_end:
          type: integer
          format: int64
        rationale:
          type: string
        method:
          type: string
        review_status:
          type: string
        evidence_level:
          type: string
        version:
          type: string
        reviewer_id:
          type: string
        reviewed_at:
          type: string
        created_at:
          type: string
    IdeologyMatch:
      type: object
      additionalProperties: true
      required:
        - article_id
        - ideology_id
        - confidence
        - evidence_span
      properties:
        article_id:
          type: string
        ideology_id:
          type: string
        confidence:
          type: number
        evidence_span:
          type: string
        rationale:
          type: string
        review_status:
          type: string
        evidence_level:
          type: string
        version:
          type: string
    QuestionAttempt:
      type: object
      additionalProperties: true
      required:
        - id
        - question_id
        - student_id
        - answer
        - score
        - created_at
      properties:
        id:
          type: string
        question_id:
          type: string
        student_id:
          type: string
        answer:
          type: string
        feedback_json: {}
        score:
          type: number
        created_at:
          type: string
    Competency:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - definition
        - levels
      properties:
        id:
          type: string
        name:
          type: string
        definition:
          type: string
        levels:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - level
              - description
            properties:
              level:
                type: string
              description:
                type: string
        observable:
          type: array
          items:
            type: string
        version:
          type: string
    StudentProfile:
      type: object
      additionalProperties: true
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        cohort:
          type: string
        background:
          type: object
          additionalProperties: true
        goals:
          type: array
          items:
            type: string
        preferences:
          type: object
          additionalProperties: true
        constraints:
          type: array
          items:
            type: string
        self_assessment:
          type: object
          additionalProperties: true
        created_at:
          type: string
        updated_at:
          type: string
    Evidence:
      type: object
      additionalProperties: true
      required:
        - id
        - student_id
        - competency_id
        - excerpt
        - occurred_at
      properties:
        id:
          type: string
        student_id:
          type: string
        competency_id:
          type: string
        level:
          type: string
        strength:
          type: string
        evidence_type:
          type: string
        source_type:
          type: string
        source_id:
          type: string
        chapter_id:
          type: string
        session_id:
          type: string
        excerpt:
          type: string
        rationale:
          type: string
        confidence:
          type: number
        method:
          type: string
        review_status:
          type: string
        review_note:
          type: string
        occurred_at:
          type: string
        created_at:
          type: string
        metadata:
          type: object
          additionalProperties: true
    Artifact:
      type: object
      additionalProperties: true
      required:
        - id
        - student_id
        - type
        - title
        - path
        - created_at
      properties:
        id:
          type: string
        student_id:
          type: string
        session_id:
          type: string
        skill_id:
          type: string
        template_id:
          type: string
        type:
          type: string
        title:
          type: string
        format:
          type: string
        path:
          type: string
        content:
          type: string
        content_json: {}
        schema_version:
          type: string
        version:
          type: integer
          format: int64
        status:
          type: string
        source_refs:
          type: array
          items:
            type: string
        evidence_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
    MemoryFact:
      type: object
      additionalProperties: true
      required:
        - id
        - kind
        - key
        - updated_at
      properties:
        id:
          type: string
        student_id:
          type: string
        kind:
          type: string
        key:
          type: string
        value: {}
        confidence:
          type: number
        source:
          type: string
        updated_at:
          type: string
    MemoryEpisode:
      type: object
      additionalProperties: true
      required:
        - id
        - student_id
        - summary
        - created_at
      properties:
        id:
          type: string
        student_id:
          type: string
        session_id:
          type: string
        summary:
          type: string
        decisions:
          type: array
          items:
            type: string
        open_questions:
          type: array
          items:
            type: string
        created_at:
          type: string
    ChatSession:
      type: object
      additionalProperties: true
      required:
        - id
        - student_id
        - created_at
        - updated_at
      properties:
        id:
          type: string
        student_id:
          type: string
        chapter_id:
          type: string
        title:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    ChatMessage:
      type: object
      additionalProperties: true
      required:
        - id
        - session_id
        - role
        - content
        - created_at
        - seq
      properties:
        id:
          type: string
        session_id:
          type: string
        role:
          type: string
        content:
          type: string
        evidence_count:
          type: integer
          format: int64
        created_at:
          type: string
        seq:
          type: integer
          format: int64
        turn_id:
          type: string
        kind:
          type: string
        payload_json: {}
    TurnRow:
      type: object
      additionalProperties: true
      required:
        - id
        - session_id
        - status
        - started_at
      properties:
        id:
          type: string
        session_id:
          type: string
        turn_id:
          type: string
        status:
          type: string
        plan_json: {}
        record_json: {}
        seq_start:
          type: integer
          format: int64
        seq_end:
          type: integer
          format: int64
        started_at:
          type: string
        finished_at:
          type: string
    ChatSessionSummary:
      type: object
      additionalProperties: true
      required:
        - id
        - status
      properties:
        id:
          type: string
        title:
          type: string
        chapterId:
          type: string
        chapterTitle:
          type: string
        status:
          type: string
        lastTurnAt:
          type: string
        pendingAsks:
          type: integer
          format: int64
        hasNewArtifact:
          type: boolean
        ledgerStatus:
          type: string
    SummaryLedger:
      type: object
      additionalProperties: true
      required:
        - source_type
        - source_id
        - status
        - updated_at
      properties:
        source_type:
          type: string
        source_id:
          type: string
        source_seq:
          type: integer
          format: int64
        summarized_seq:
          type: integer
          format: int64
        source_hash:
          type: string
        status:
          type: string
        summary_id:
          type: string
        attempts:
          type: integer
          format: int64
        last_error:
          type: string
        updated_at:
          type: string
    LearningStateSnapshot:
      type: object
      additionalProperties: true
      required:
        - student_id
        - phase
        - phase_confidence
        - scope
      properties:
        student_id:
          type: string
        phase:
          type: string
        phase_confidence:
          type: string
        phase_reasons:
          type: array
          items:
            type: string
        scope:
          type: object
          additionalProperties: true
        goal:
          type: string
        plan:
          type: object
          additionalProperties: true
        evidence:
          type: object
          additionalProperties: true
        artifacts:
          type: object
          additionalProperties: true
        session:
          type: object
          additionalProperties: true
        signals:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties: true
    LearningSuggestions:
      type: object
      additionalProperties: true
      required:
        - title
        - items
      properties:
        title:
          type: string
        description:
          type: string
        source:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            required:
              - label
              - prompt
            properties:
              label:
                type: string
              prompt:
                type: string
    GrowthSnapshot:
      type: object
      additionalProperties: true
      required:
        - id
        - student_id
        - chapter_id
        - checkpoint
        - competency_id
        - level
        - confidence
        - evidence_count
        - created_at
      properties:
        id:
          type: string
        student_id:
          type: string
        chapter_id:
          type: string
        checkpoint:
          type: string
        competency_id:
